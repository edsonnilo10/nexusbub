name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Evita rodar duas vezes quando um PR é aberto a partir de uma branch do mesmo repo
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck • Lint • Test • Build
    runs-on: ubuntu-latest
    # Pula PRs do Dependabot para economizar minutos do Actions
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bunx eslint .

      - name: Test
        run: bunx vitest run

      - name: Build
        run: bunx vite build
